<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Home page</title>
</head>
<body>
    <div id="header">
    <h1>Gestion Des Etudiants</h1>
    </div>

    <div id="inscri">
        <form action="#">
            <label for="nom">Nom :</label>              <input id="nom" type="text"> <br>
            <label for="prenom">Prenom :</label>        <input id="prenom" type="text"> <br>
            <label for="email">Email :</label>          <input id="email" type="text"> <br>
            <label for="telephone">Telephone :</label>  <input id="telephone" type="text"> <br>
            <label for="age">Age :</label>              <input id="age" type="text"> <br>
            <label for="filiere">Filiere :</label>      <input id="filiere" type="text"> <br>

            <button type="submit" id="ajouter">Ajouter</button>
        </form>
    </div>
    <br>
<section class="student-list">
 
    


  <div class="rechercher-bar">
    <label for="rechercheEtudiant">Rechercher des étudiants</label>
    <input
      type="search"
      id="rechercheEtudiant"
      placeholder="Rechercher par nom, email ou programme"
    >
    <button type="button" id="btnRechercher">Rechercher</button>
  </div>
<br>
  <div class="table-responsive">
    <table id="etudiantsTable">
      <thead>
        <tr>
          <th>premier nom</th>
          <th>Nom de famille</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Age</th>
          <th>Program</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="listeEtudiants">

      </tbody>
    </table>
  </div>
</section>
</body>
</html>
